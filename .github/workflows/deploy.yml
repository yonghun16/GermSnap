name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main # 기본 브랜치가 master면 master로 수정

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1. docs/ 폴더 내부로 이동하여 패키지 설치 및 Quartz 빌드 실행
      - name: Install Dependencies & Build Quartz
        run: |
          cd docs
          npm ci
          npx quartz build

      # 2. docs/public 폴더에 생성된 결과물을 업로드 경로로 지정
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
